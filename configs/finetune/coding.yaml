domain: coding
seed: 42

data:
  languages: [python]       # HumanEval is Python
  train: 12000              # from ise-uiuc/Magicoder-OSS-Instruct-75K
  eval: 500

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: all-linear

train:
  max_length: 2048
  per_device_batch_size: 4
  grad_accum: 4
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_frac: 0.03
  max_steps: 750
  logging_steps: 10
  eval_steps: 250
  save_steps: 250
  save_total_limit: 2
  optim: paged_adamw_8bit
